<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Four seasons overview</title><desc id="desc">Six terms in each traditional Chinese season; not a global climate classification.</desc><rect width="1200" height="500" fill="#FAFAF7"/><text x="40" y="48" font-family="sans-serif" font-size="25" fill="#243329">FOUR SEASONS · 24 SOLAR TERMS</text><line x1="40" y1="85" x2="300" y2="85" stroke="#235B50" stroke-width="4"/><text x="40" y="128" font-family="sans-serif" font-size="24" fill="#235B50">春 / SPRING</text><text x="40" y="178" font-family="sans-serif" font-size="19" fill="#243329">01  立春 · lichun</text><text x="40" y="219" font-family="sans-serif" font-size="19" fill="#243329">02  雨水 · yushui</text><text x="40" y="260" font-family="sans-serif" font-size="19" fill="#243329">03  惊蛰 · jingzhe</text><text x="40" y="301" font-family="sans-serif" font-size="19" fill="#243329">04  春分 · chunfen</text><text x="40" y="342" font-family="sans-serif" font-size="19" fill="#243329">05  清明 · qingming</text><text x="40" y="383" font-family="sans-serif" font-size="19" fill="#243329">06  谷雨 · guyu</text><line x1="330" y1="85" x2="590" y2="85" stroke="#91462E" stroke-width="4"/><text x="330" y="128" font-family="sans-serif" font-size="24" fill="#91462E">夏 / SUMMER</text><text x="330" y="178" font-family="sans-serif" font-size="19" fill="#243329">07  立夏 · lixia</text><text x="330" y="219" font-family="sans-serif" font-size="19" fill="#243329">08  小满 · xiaoman</text><text x="330" y="260" font-family="sans-serif" font-size="19" fill="#243329">09  芒种 · mangzhong</text><text x="330" y="301" font-family="sans-serif" font-size="19" fill="#243329">10  夏至 · xiazhi</text><text x="330" y="342" font-family="sans-serif" font-size="19" fill="#243329">11  小暑 · xiaoshu</text><text x="330" y="383" font-family="sans-serif" font-size="19" fill="#243329">12  大暑 · dashu</text><line x1="620" y1="85" x2="880" y2="85" stroke="#70562A" stroke-width="4"/><text x="620" y="128" font-family="sans-serif" font-size="24" fill="#70562A">秋 / AUTUMN</text><text x="620" y="178" font-family="sans-serif" font-size="19" fill="#243329">13  立秋 · liqiu</text><text x="620" y="219" font-family="sans-serif" font-size="19" fill="#243329">14  处暑 · chushu</text><text x="620" y="260" font-family="sans-serif" font-size="19" fill="#243329">15  白露 · bailu</text><text x="620" y="301" font-family="sans-serif" font-size="19" fill="#243329">16  秋分 · qiufen</text><text x="620" y="342" font-family="sans-serif" font-size="19" fill="#243329">17  寒露 · hanlu</text><text x="620" y="383" font-family="sans-serif" font-size="19" fill="#243329">18  霜降 · shuangjiang</text><line x1="910" y1="85" x2="1170" y2="85" stroke="#3C566F" stroke-width="4"/><text x="910" y="128" font-family="sans-serif" font-size="24" fill="#3C566F">冬 / WINTER</text><text x="910" y="178" font-family="sans-serif" font-size="19" fill="#243329">19  立冬 · lidong</text><text x="910" y="219" font-family="sans-serif" font-size="19" fill="#243329">20  小雪 · xiaoxue</text><text x="910" y="260" font-family="sans-serif" font-size="19" fill="#243329">21  大雪 · daxue</text><text x="910" y="301" font-family="sans-serif" font-size="19" fill="#243329">22  冬至 · dongzhi</text><text x="910" y="342" font-family="sans-serif" font-size="19" fill="#243329">23  小寒 · xiaohan</text><text x="910" y="383" font-family="sans-serif" font-size="19" fill="#243329">24  大寒 · dahan</text><text x="40" y="468" font-family="sans-serif" font-size="16" fill="#243329">Traditional Chinese grouping. Local climates and seasonal experiences differ.</text></svg>
