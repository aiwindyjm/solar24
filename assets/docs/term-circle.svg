<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 790" role="img" aria-labelledby="title desc"><title id="title">24 solar terms sequence</title><desc id="desc">Clockwise editorial order starting at Lichun; not an orbit or calendar-date scale.</desc><rect width="920" height="790" fill="#FAFAF7"/><circle cx="460" cy="380" r="226" fill="none" stroke="#B5BFB6"/><circle cx="460.0" cy="154.0" r="5" fill="#235B50"/><text x="460.0" y="88.0" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#235B50">01 立春</text><circle cx="518.5" cy="161.7" r="5" fill="#235B50"/><text x="537.1" y="98.2" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#235B50">02 雨水</text><circle cx="573.0" cy="184.3" r="5" fill="#235B50"/><text x="609.0" y="127.9" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#235B50">03 惊蛰</text><circle cx="619.8" cy="220.2" r="5" fill="#235B50"/><text x="670.7" y="175.3" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#235B50">04 春分</text><circle cx="655.7" cy="267.0" r="5" fill="#235B50"/><text x="718.1" y="237.0" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#235B50">05 清明</text><circle cx="678.3" cy="321.5" r="5" fill="#235B50"/><text x="747.8" y="308.9" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#235B50">06 谷雨</text><circle cx="686.0" cy="380.0" r="5" fill="#91462E"/><text x="758.0" y="386.0" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#91462E">07 立夏</text><circle cx="678.3" cy="438.5" r="5" fill="#91462E"/><text x="747.8" y="463.1" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#91462E">08 小满</text><circle cx="655.7" cy="493.0" r="5" fill="#91462E"/><text x="718.1" y="535.0" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#91462E">09 芒种</text><circle cx="619.8" cy="539.8" r="5" fill="#91462E"/><text x="670.7" y="596.7" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#91462E">10 夏至</text><circle cx="573.0" cy="575.7" r="5" fill="#91462E"/><text x="609.0" y="644.1" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#91462E">11 小暑</text><circle cx="518.5" cy="598.3" r="5" fill="#91462E"/><text x="537.1" y="673.8" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#91462E">12 大暑</text><circle cx="460.0" cy="606.0" r="5" fill="#70562A"/><text x="460.0" y="684.0" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#70562A">13 立秋</text><circle cx="401.5" cy="598.3" r="5" fill="#70562A"/><text x="382.9" y="673.8" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#70562A">14 处暑</text><circle cx="347.0" cy="575.7" r="5" fill="#70562A"/><text x="311.0" y="644.1" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#70562A">15 白露</text><circle cx="300.2" cy="539.8" r="5" fill="#70562A"/><text x="249.3" y="596.7" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#70562A">16 秋分</text><circle cx="264.3" cy="493.0" r="5" fill="#70562A"/><text x="201.9" y="535.0" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#70562A">17 寒露</text><circle cx="241.7" cy="438.5" r="5" fill="#70562A"/><text x="172.2" y="463.1" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#70562A">18 霜降</text><circle cx="234.0" cy="380.0" r="5" fill="#3C566F"/><text x="162.0" y="386.0" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#3C566F">19 立冬</text><circle cx="241.7" cy="321.5" r="5" fill="#3C566F"/><text x="172.2" y="308.9" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#3C566F">20 小雪</text><circle cx="264.3" cy="267.0" r="5" fill="#3C566F"/><text x="201.9" y="237.0" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#3C566F">21 大雪</text><circle cx="300.2" cy="220.2" r="5" fill="#3C566F"/><text x="249.3" y="175.3" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#3C566F">22 冬至</text><circle cx="347.0" cy="184.3" r="5" fill="#3C566F"/><text x="311.0" y="127.9" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#3C566F">23 小寒</text><circle cx="401.5" cy="161.7" r="5" fill="#3C566F"/><text x="382.9" y="98.2" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#3C566F">24 大寒</text><text x="460" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="42" fill="#243329">A year of attention</text><text x="460" y="400" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#243329">START AT LICHUN · READ CLOCKWISE</text><text x="460" y="750" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#243329">Editorial sequence, not an orbit, date scale or weather prediction.</text></svg>
